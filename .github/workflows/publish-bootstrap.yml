name: publish-bootstrap

# npm Trusted Publishing requires an existing package. This one-time workflow
# creates v0.1.0 in CI; all later versions use publish.yml with OIDC instead.
on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify first release tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v0.1.0" ] || [ "$PKG_VERSION" != "0.1.0" ]; then
            echo "::error::Bootstrap requires tag v0.1.0 and package.json version 0.1.0"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
      - name: Publish initial package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set the NPM_BOOTSTRAP_TOKEN repository secret before publishing v0.1.0"
            exit 1
          fi
          npm publish --access public
